{%- if site.newsletter.form_id and site.newsletter.email_entry -%}
<style>
  .subscribe { margin: 56px 0 40px; padding: 32px 24px; text-align: center; border-top: 1px solid #e8e8e8; border-bottom: 1px solid #e8e8e8; }
  .subscribe-title { margin: 0 0 6px; font-size: 20px; font-weight: 600; }
  .subscribe-lead { margin: 0 auto 20px; max-width: 420px; color: #666; }
  .subscribe-form { display: flex; max-width: 420px; margin: 0 auto; }
  .subscribe-form input { flex: 1; min-width: 0; padding: 11px 14px; font-size: 16px; border: 1px solid #ccc; border-right: none; border-radius: 6px 0 0 6px; outline: none; }
  .subscribe-form input:focus { border-color: #2f9e44; }
  .subscribe-form button { padding: 11px 20px; font-size: 16px; font-weight: 600; color: #fff; background: #2f9e44; border: 1px solid #2f9e44; border-radius: 0 6px 6px 0; cursor: pointer; white-space: nowrap; }
  .subscribe-form button:hover { background: #27863a; }
  .subscribe-done { margin: 0; font-weight: 600; color: #2f9e44; }
</style>
<section class="subscribe">
  <p class="subscribe-title">Cảm ơn bạn đã đọc {{ site.title }}!</p>
  <p class="subscribe-lead">Đăng ký miễn phí để nhận bài mới qua email. Thư gửi thẳng từ hộp thư của Phát, reply là tới tay.</p>
  <form class="subscribe-form" id="subscribe-form"
        action="https://docs.google.com/forms/d/e/{{ site.newsletter.form_id }}/formResponse"
        method="POST" target="subscribe-sink">
    <input type="email" name="{{ site.newsletter.email_entry }}" required placeholder="Email của bạn" aria-label="Email">
    <button type="submit">Đăng ký</button>
  </form>
  <p class="subscribe-done" id="subscribe-done" hidden>✓ Đã đăng ký. Bài sau sẽ tới hộp thư của bạn!</p>
  <iframe name="subscribe-sink" hidden></iframe>
  <script>
    document.getElementById("subscribe-form").addEventListener("submit", function () {
      var form = this;
      setTimeout(function () {
        form.hidden = true;
        document.getElementById("subscribe-done").hidden = false;
      }, 300);
    });
  </script>
</section>
{%- endif -%}
